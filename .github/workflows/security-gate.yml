name: Security Gate

on:
  workflow_call:
    inputs:
      # Secret findings (strings - job outputs are always strings)
      secret_findings:
        type: string
        default: '0'
      trufflehog_findings:
        type: string
        default: '0'

      # SAST findings
      gosec_findings:
        type: string
        default: '0'
      gosec_high:
        type: string
        default: '0'
      bandit_findings:
        type: string
        default: '0'
      bandit_high:
        type: string
        default: '0'
      semgrep_findings:
        type: string
        default: '0'

      # Dependency findings
      trivy_findings:
        type: string
        default: '0'
      trivy_critical:
        type: string
        default: '0'
      trivy_high:
        type: string
        default: '0'
      trivy_licenses:
        type: string
        default: '0'
      govulncheck_findings:
        type: string
        default: '0'
      osv_findings:
        type: string
        default: '0'

      # Language flags
      has_go:
        type: boolean
        default: false
      has_python:
        type: boolean
        default: false

    outputs:
      status:
        description: 'Gate status: passed, warning, failed'
        value: ${{ jobs.gate.outputs.status }}
      reason:
        description: 'Reason for gate status'
        value: ${{ jobs.gate.outputs.reason }}

jobs:
  gate:
    name: Security Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      status: ${{ steps.evaluate.outputs.status }}
      reason: ${{ steps.evaluate.outputs.reason }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: results
        continue-on-error: true

      - name: Evaluate Security Gate
        id: evaluate
        run: |
          # Input aggregation
          SECRETS="${{ inputs.secret_findings }}"
          TRUFFLEHOG="${{ inputs.trufflehog_findings }}"
          GOSEC="${{ inputs.gosec_findings }}"
          GOSEC_HIGH="${{ inputs.gosec_high }}"
          BANDIT="${{ inputs.bandit_findings }}"
          BANDIT_HIGH="${{ inputs.bandit_high }}"
          SEMGREP="${{ inputs.semgrep_findings }}"
          TRIVY="${{ inputs.trivy_findings }}"
          TRIVY_CRITICAL="${{ inputs.trivy_critical }}"
          TRIVY_HIGH="${{ inputs.trivy_high }}"
          LICENSES="${{ inputs.trivy_licenses }}"
          GOVULN="${{ inputs.govulncheck_findings }}"
          OSV="${{ inputs.osv_findings }}"
          HAS_GO="${{ inputs.has_go }}"
          HAS_PYTHON="${{ inputs.has_python }}"

          # Calculate totals
          SAST=$((GOSEC + BANDIT + SEMGREP))
          DEPS=$((TRIVY + GOVULN + OSV))
          TOTAL=$((SECRETS + SAST + DEPS))

          # Export for PR comment
          echo "secrets=$SECRETS" >> $GITHUB_OUTPUT
          echo "trufflehog=$TRUFFLEHOG" >> $GITHUB_OUTPUT
          echo "gosec=$GOSEC" >> $GITHUB_OUTPUT
          echo "gosec_high=$GOSEC_HIGH" >> $GITHUB_OUTPUT
          echo "bandit=$BANDIT" >> $GITHUB_OUTPUT
          echo "bandit_high=$BANDIT_HIGH" >> $GITHUB_OUTPUT
          echo "semgrep=$SEMGREP" >> $GITHUB_OUTPUT
          echo "trivy=$TRIVY" >> $GITHUB_OUTPUT
          echo "trivy_critical=$TRIVY_CRITICAL" >> $GITHUB_OUTPUT
          echo "trivy_high=$TRIVY_HIGH" >> $GITHUB_OUTPUT
          echo "licenses=$LICENSES" >> $GITHUB_OUTPUT
          echo "govuln=$GOVULN" >> $GITHUB_OUTPUT
          echo "osv=$OSV" >> $GITHUB_OUTPUT
          echo "sast=$SAST" >> $GITHUB_OUTPUT
          echo "deps=$DEPS" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          # Write summary
          echo "### Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Findings |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets | $SECRETS (TruffleHog verified: $TRUFFLEHOG) |" >> $GITHUB_STEP_SUMMARY

          # SAST breakdown
          SAST_DETAIL="Semgrep: $SEMGREP"
          if [ "$HAS_GO" = "true" ]; then
            SAST_DETAIL="Gosec: $GOSEC [$GOSEC_HIGH high], $SAST_DETAIL"
          fi
          if [ "$HAS_PYTHON" = "true" ]; then
            SAST_DETAIL="Bandit: $BANDIT [$BANDIT_HIGH high], $SAST_DETAIL"
          fi
          echo "| SAST | $SAST ($SAST_DETAIL) |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | $DEPS (Trivy: $TRIVY [$TRIVY_CRITICAL crit, $TRIVY_HIGH high], govuln: $GOVULN, OSV: $OSV) |" >> $GITHUB_STEP_SUMMARY
          echo "| Licenses | $LICENSES non-permissive |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Gate logic
          # BLOCKING: verified secrets, critical vulns, HIGH SAST (language-specific)
          if [ "$TRUFFLEHOG" -gt 0 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "reason=Verified secrets detected by TruffleHog" >> $GITHUB_OUTPUT
            echo "::error::Security gate FAILED: $TRUFFLEHOG verified secret(s)"
            echo "**GATE FAILED**: Verified secrets detected" >> $GITHUB_STEP_SUMMARY
          elif [ "$TRIVY_CRITICAL" -gt 0 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "reason=$TRIVY_CRITICAL CRITICAL vulnerability(ies) detected" >> $GITHUB_OUTPUT
            echo "::error::Security gate FAILED: $TRIVY_CRITICAL CRITICAL vulnerability(ies)"
            echo "**GATE FAILED**: CRITICAL vulnerabilities detected" >> $GITHUB_STEP_SUMMARY
          elif [ "$HAS_GO" = "true" ] && [ "$GOSEC_HIGH" -gt 0 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "reason=$GOSEC_HIGH HIGH severity gosec finding(s)" >> $GITHUB_OUTPUT
            echo "::error::Security gate FAILED: $GOSEC_HIGH HIGH severity gosec finding(s)"
            echo "**GATE FAILED**: HIGH severity Go SAST findings" >> $GITHUB_STEP_SUMMARY
          elif [ "$HAS_PYTHON" = "true" ] && [ "$BANDIT_HIGH" -gt 0 ]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "reason=$BANDIT_HIGH HIGH severity Bandit finding(s)" >> $GITHUB_OUTPUT
            echo "::error::Security gate FAILED: $BANDIT_HIGH HIGH severity Bandit finding(s)"
            echo "**GATE FAILED**: HIGH severity Python SAST findings" >> $GITHUB_STEP_SUMMARY
          elif [ "$TOTAL" -gt 0 ]; then
            echo "status=warning" >> $GITHUB_OUTPUT
            echo "reason=$TOTAL issue(s) found (review recommended)" >> $GITHUB_OUTPUT
            echo "::warning::Security gate passed with warnings: $TOTAL issue(s)"
            echo "**GATE PASSED WITH WARNINGS**: $TOTAL issue(s) found" >> $GITHUB_STEP_SUMMARY
          else
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "reason=No security issues detected" >> $GITHUB_OUTPUT
            echo "**GATE PASSED**: No security issues detected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Helper to safely read JSON
            const readJSON = (path) => {
              try {
                return JSON.parse(fs.readFileSync(path, 'utf8'));
              } catch { return null; }
            };

            // Build comment
            let body = `## Security Audit Results\n\n`;

            const gateStatus = '${{ steps.evaluate.outputs.status }}';
            const gateReason = '${{ steps.evaluate.outputs.reason }}';

            // Status badge
            if (gateStatus === 'passed') {
              body += `**Security gate passed** - No issues detected\n\n`;
            } else if (gateStatus === 'warning') {
              body += `**Security gate passed with warnings** - ${gateReason}\n\n`;
            } else {
              body += `**Security gate FAILED** - ${gateReason}\n\n`;
            }

            // Get detailed counts
            const secrets = parseInt('${{ steps.evaluate.outputs.secrets }}') || 0;
            const trufflehog = parseInt('${{ steps.evaluate.outputs.trufflehog }}') || 0;
            const gosec = parseInt('${{ steps.evaluate.outputs.gosec }}') || 0;
            const gosecHigh = parseInt('${{ steps.evaluate.outputs.gosec_high }}') || 0;
            const bandit = parseInt('${{ steps.evaluate.outputs.bandit }}') || 0;
            const banditHigh = parseInt('${{ steps.evaluate.outputs.bandit_high }}') || 0;
            const semgrep = parseInt('${{ steps.evaluate.outputs.semgrep }}') || 0;
            const sast = parseInt('${{ steps.evaluate.outputs.sast }}') || 0;
            const trivy = parseInt('${{ steps.evaluate.outputs.trivy }}') || 0;
            const trivyCritical = parseInt('${{ steps.evaluate.outputs.trivy_critical }}') || 0;
            const trivyHigh = parseInt('${{ steps.evaluate.outputs.trivy_high }}') || 0;
            const govuln = parseInt('${{ steps.evaluate.outputs.govuln }}') || 0;
            const osv = parseInt('${{ steps.evaluate.outputs.osv }}') || 0;
            const deps = parseInt('${{ steps.evaluate.outputs.deps }}') || 0;
            const licenses = parseInt('${{ steps.evaluate.outputs.licenses }}') || 0;

            // Build URLs
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const runUrl = `${repoUrl}/actions/runs/${context.runId}`;
            const codeScanning = `${repoUrl}/security/code-scanning`;
            const secretScanning = `${repoUrl}/security/secret-scanning`;
            const dependabot = `${repoUrl}/security/dependabot`;

            // Quick summary icons
            const secretIcon = secrets === 0 ? '✅' : (trufflehog > 0 ? '❌' : '⚠️');
            const sastIcon = sast === 0 ? '✅' : (gosecHigh > 0 || banditHigh > 0 ? '❌' : '⚠️');
            const depsIcon = deps === 0 ? '✅' : (trivyCritical > 0 ? '❌' : '⚠️');
            const licenseIcon = licenses === 0 ? '✅' : '⚠️';

            body += `${secretIcon} Secrets: ${secrets} · ${sastIcon} SAST: ${sast} · ${depsIcon} Deps: ${deps} · ${licenseIcon} Licenses: ${licenses}\n\n`;

            // Collapsible details
            body += `<details>\n<summary>View detailed breakdown</summary>\n\n`;
            body += `| Category | Findings | Details |\n|----------|----------|----------|\n`;

            // Secrets row
            if (secrets === 0) {
              body += `| ✅ Secrets | 0 | No secrets detected |\n`;
            } else {
              body += `| ${secretIcon} Secrets | ${secrets} | TruffleHog verified: ${trufflehog} — [View alerts](${secretScanning}) |\n`;
            }

            // SAST row
            if (sast === 0) {
              body += `| ✅ SAST | 0 | No issues found |\n`;
            } else {
              let sastDetails = [];
              if (gosec > 0) sastDetails.push(`[Gosec](${codeScanning}?query=tool%3Agosec): ${gosec} (${gosecHigh} high)`);
              if (bandit > 0) sastDetails.push(`[Bandit](${codeScanning}?query=tool%3Abandit): ${bandit} (${banditHigh} high)`);
              if (semgrep > 0) sastDetails.push(`[Semgrep](${codeScanning}?query=tool%3Asemgrep): ${semgrep}`);
              body += `| ${sastIcon} SAST | ${sast} | ${sastDetails.join(' · ')} |\n`;
            }

            // Dependencies row
            if (deps === 0) {
              body += `| ✅ Dependencies | 0 | No vulnerabilities found |\n`;
            } else {
              let depDetails = [];
              if (trivy > 0) depDetails.push(`Trivy: ${trivy} (${trivyCritical} crit, ${trivyHigh} high)`);
              if (govuln > 0) depDetails.push(`govulncheck: ${govuln}`);
              if (osv > 0) depDetails.push(`OSV: ${osv}`);
              body += `| ${depsIcon} Dependencies | ${deps} | ${depDetails.join(', ')} — [View](${dependabot}) |\n`;
            }

            // Licenses row
            if (licenses === 0) {
              body += `| ✅ Licenses | 0 | All permissive |\n`;
            } else {
              body += `| ${licenseIcon} Licenses | ${licenses} | Non-permissive — [View artifacts](${runUrl}#artifacts) |\n`;
            }

            body += `\n</details>\n\n`;

            // Footer with links
            body += `[View workflow run](${runUrl}) · [Security overview](${repoUrl}/security)\n`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user?.type === 'Bot' &&
              c.body?.includes('Security Audit Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Fail on blocking findings
        if: steps.evaluate.outputs.status == 'failed'
        run: |
          echo "::error::Security gate failed: ${{ steps.evaluate.outputs.reason }}"
          exit 1
